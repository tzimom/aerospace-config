start-at-login = true

after-startup-command = 'workspace ANY1'

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default layout settings
default-root-container-layout = 'tiles' # Possible values: tiles|accordion
default-root-container-orientation = 'auto' # Possible values: horizontal|vertical|auto

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
accordion-padding = 40

# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'dvorak' # Possible values: (qwerty|dvorak|colemak)

[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.top = 5
outer.bottom = 8
outer.left = 8
outer.right = 8

# -----------------------------------------------------------------------------------------
# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
#                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
#                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
#                   sectionSign (ISO keyboards only, european keyboards only)
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
# - Arrows.         left, down, up, right
#
# All possible modifiers: cmd, alt, ctrl, shift
# All possible commands: https://nikitabobko.github.io/AeroSpace/commands
# -----------------------------------------------------------------------------------------

# 'main' binding mode must be always presented
[mode.main.binding]
# See: https://nikitabobko.github.io/AeroSpace/commands#layout
alt-period = 'layout accordion tiles'
alt-comma = 'layout horizontal vertical'

# See: https://nikitabobko.github.io/AeroSpace/commands#focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# See: https://nikitabobko.github.io/AeroSpace/commands#move
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

alt-leftSquareBracket = 'workspace ANY1'
alt-rightSquareBracket = 'workspace ANY2'
alt-slash = 'workspace WEB'
alt-equal = 'workspace NOTES'
alt-backslash = 'workspace TERM'
alt-minus = 'workspace COMM'
alt-semicolon = 'workspace MEDIA'

alt-shift-leftSquareBracket = 'move-node-to-workspace ANY1'
alt-shift-rightSquareBracket = 'move-node-to-workspace ANY2'
alt-shift-slash = 'move-node-to-workspace WEB'
alt-shift-equal = 'move-node-to-workspace NOTES'
alt-shift-backslash = 'move-node-to-workspace TERM'
alt-shift-minus = 'move-node-to-workspace COMM'
alt-shift-semicolon = 'move-node-to-workspace MEDIA'

alt-tab = 'workspace-back-and-forth'

alt-quote = 'mode service'
alt-shift-quote = 'mode extra'

[mode.service.binding]
esc = 'mode main'
alt-quote = 'mode main'
alt-shift-quote = 'mode extra'

r = ['reload-config', 'mode main']
shift-r = ['flatten-workspace-tree', 'mode main']

f = ['layout floating tiling', 'mode main']

backspace = ['close-all-windows-but-current', 'mode main']

# Resize windows
comma = 'resize smart -10'
period = 'resize smart +10'
shift-comma = 'resize smart -100'
shift-period = 'resize smart +100'

shift-h = ['join-with left', 'mode main']
shift-j = ['join-with down', 'mode main']
shift-k = ['join-with up', 'mode main']
shift-l = ['join-with right', 'mode main']

minus = 'volume down'
equal = 'volume up'
shift-minus = 'volume set 0'
shift-equal = 'volume set 100'

[mode.extra.binding]
esc = 'mode main'
alt-shift-quote = 'mode main'
alt-quote = 'mode service'

1 = ['workspace EXTRA1', 'mode main']
2 = ['workspace EXTRA2', 'mode main']
3 = ['workspace EXTRA3', 'mode main']
4 = ['workspace EXTRA4', 'mode main']
5 = ['workspace EXTRA5', 'mode main']
6 = ['workspace EXTRA6', 'mode main']
7 = ['workspace EXTRA7', 'mode main']
8 = ['workspace EXTRA8', 'mode main']
9 = ['workspace EXTRA9', 'mode main']

# See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
shift-1 = ['move-node-to-workspace EXTRA1', 'mode main']
shift-2 = ['move-node-to-workspace EXTRA2', 'mode main']
shift-3 = ['move-node-to-workspace EXTRA3', 'mode main']
shift-4 = ['move-node-to-workspace EXTRA4', 'mode main']
shift-5 = ['move-node-to-workspace EXTRA5', 'mode main']
shift-6 = ['move-node-to-workspace EXTRA6', 'mode main']
shift-7 = ['move-node-to-workspace EXTRA7', 'mode main']
shift-8 = ['move-node-to-workspace EXTRA8', 'mode main']
shift-9 = ['move-node-to-workspace EXTRA9', 'mode main']

[[on-window-detected]] # System settings -> floating
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]] # Arc -> WEB
if.app-id = 'company.thebrowser.Browser'
run = 'move-node-to-workspace WEB'

[[on-window-detected]] # Brave -> WEB
if.app-id = 'com.brave.Browser'
run = 'move-node-to-workspace WEB'

[[on-window-detected]] # Firefox -> WEB
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace WEB'

[[on-window-detected]] # WezTerm -> TERM
if.app-id = 'com.github.wez.wezterm'
run = 'move-node-to-workspace TERM'

[[on-window-detected]] # Ghostty -> TERM
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace TERM'

[[on-window-detected]] # Obsidian -> NOTES
if.app-id = 'md.obsidian'
run = 'move-node-to-workspace NOTES'

[[on-window-detected]] # Discord -> COMM
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace COMM'

[[on-window-detected]] # WhatsApp -> COMM
if.app-id = 'net.whatsapp.WhatsApp'
run = 'move-node-to-workspace COMM'

[[on-window-detected]] # Spotify -> MEDIA
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace MEDIA'
